---
- name: Configure the platform runtime
  hosts: platform_nodes
  become: true
  gather_facts: true

  vars:
    platform_apps_root: "{{ platform_root }}/apps"
    platform_data_root: "{{ platform_root }}/data"
    platform_backup_root: "{{ platform_root }}/backups"
    platform_proxy_network: proxy
    platform_monitoring_network: monitoring
    platform_monitoring_subnet: 172.23.0.0/16

  roles:
    - role: container_runtime
      tags:
        - runtime
        - docker
        - container-runtime

    - role: docker_networks
      tags:
        - runtime
        - docker
        - docker-networks

    - role: storage
      tags:
        - runtime
        - storage

    - role: traefik
      tags:
        - runtime
        - traefik
