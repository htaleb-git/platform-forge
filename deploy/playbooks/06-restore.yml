---
- name: Restore platform applications
  hosts: platform_nodes
  become: true
  gather_facts: false

  tasks:
    - name: Validate explicit restore request
      ansible.builtin.assert:
        that:
          - restore_application | default('') in ['gitlab', 'nextcloud', 'n8n', 'wordpress']
          - restore_snapshot_id | default('') is match('^[A-Fa-f0-9]{8,64}$')
          - restic_enabled | bool
          - vars[restore_application + '_enabled'] | bool
        fail_msg: "Restore requires one enabled V1 application and an explicit hexadecimal Restic snapshot ID."
      tags: [never, restore-gitlab, restore-nextcloud, restore-n8n, restore-wordpress]

    - name: Check restore scripts
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/local/sbin/restore-restic-application.sh
        - "/usr/local/sbin/restore-{{ restore_application }}.sh"
      register: restore_scripts
      tags: [never, restore-gitlab, restore-nextcloud, restore-n8n, restore-wordpress]

    - name: Validate restore scripts
      ansible.builtin.assert:
        that:
          - restore_scripts.results | map(attribute='stat.exists') | select('equalto', false) | list | length == 0
          - restore_scripts.results | map(attribute='stat.isreg') | select('equalto', false) | list | length == 0
          - restore_scripts.results | map(attribute='stat.executable') | select('equalto', false) | list | length == 0
        fail_msg: "Required restore scripts are unavailable."
      tags: [never, restore-gitlab, restore-nextcloud, restore-n8n, restore-wordpress]

    - name: Confirm destructive restore
      ansible.builtin.pause:
        prompt: |
          WARNING: {{ restore_application }} will be restored from exact Restic snapshot {{ restore_snapshot_id }}.
          Type RESTORE to continue
      register: restore_confirmation
      tags: [never, restore-gitlab, restore-nextcloud, restore-n8n, restore-wordpress]

    - name: Confirm live state replacement
      ansible.builtin.pause:
        prompt: |
          FINAL WARNING: current {{ restore_application }} state will be replaced.
          Type ERASE-AND-RESTORE to continue
      register: erase_confirmation
      when: restore_confirmation.user_input == "RESTORE"
      tags: [never, restore-gitlab, restore-nextcloud, restore-n8n, restore-wordpress]

    - name: Validate destructive confirmations
      ansible.builtin.assert:
        that:
          - restore_confirmation.user_input == "RESTORE"
          - erase_confirmation.user_input | default('') == "ERASE-AND-RESTORE"
        fail_msg: "Restore cancelled."
      tags: [never, restore-gitlab, restore-nextcloud, restore-n8n, restore-wordpress]

    - name: Restore selected application from exact snapshot
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/restore-restic-application.sh
          - "{{ restore_application }}"
          - "{{ restore_snapshot_id }}"
      register: restore_result
      changed_when: true
      no_log: true
      tags: [never, restore-gitlab, restore-nextcloud, restore-n8n, restore-wordpress]

    - name: Report restore completion
      ansible.builtin.debug:
        msg: "{{ restore_application }} restore completed from snapshot {{ restore_snapshot_id }}."
      tags: [never, restore-gitlab, restore-nextcloud, restore-n8n, restore-wordpress]
