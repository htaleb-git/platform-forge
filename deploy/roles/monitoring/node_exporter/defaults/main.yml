---
node_exporter_enabled: false
node_exporter_version: 1.10.2
node_exporter_user: node_exporter
node_exporter_group: node_exporter
node_exporter_port: 9100
node_exporter_textfile_dir: /var/lib/node_exporter/textfile_collector

node_exporter_install_dir: /usr/local/bin
node_exporter_binary: "{{ node_exporter_install_dir }}/node_exporter"

node_exporter_architecture_map:
  x86_64: amd64
  aarch64: arm64
node_exporter_architecture: "{{ node_exporter_architecture_map.get(ansible_facts.architecture, '') }}"
node_exporter_archive: "node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_architecture }}.tar.gz"
node_exporter_download_url: >-
  https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/{{ node_exporter_archive }}

node_exporter_tmp_dir: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_architecture }}"
