---
- name: Validate GitLab configuration
  ansible.builtin.assert:
    that:
      - gitlab_app_dir is match('^/[^/]+')
      - gitlab_data_dir is match('^/[^/]+')
      - gitlab_hostname | length > 0
      - gitlab_external_url is match('^https://')
      - gitlab_ssh_port | int >= 1
      - gitlab_ssh_port | int <= 65535
    fail_msg: "Invalid GitLab path, hostname, external URL, or SSH port configuration."

- name: Create gitlab directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ gitlab_app_dir }}"
    - "{{ gitlab_data_dir }}"
    - "{{ gitlab_config_dir }}"
    - "{{ gitlab_logs_dir }}"
    - "{{ gitlab_data_store_dir }}"

- name: generate gitlab compose.yml file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ gitlab_app_dir }}/compose.yml"
    owner: "{{ gitlab_storage_owner }}"
    group: "{{ gitlab_storage_group }}"
    mode: '0644'

- name: Deploy gitlab docker-compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ gitlab_app_dir }}"
    state: present
  when: not ansible_check_mode

- name: Wait for GitLab container to be healthy
  community.docker.docker_container_info:
    name: "{{ gitlab_container_name }}"
  register: gitlab_container_info
  until:
    - gitlab_container_info.exists
    - gitlab_container_info.container.State.Status == "running"
    - gitlab_container_info.container.State.Health.Status == "healthy"
  retries: 40
  delay: 15
  when: not ansible_check_mode
