---
- name: Validate Nextcloud configuration
  ansible.builtin.assert:
    that:
      - nextcloud_app_dir is match('^/[^/]+')
      - nextcloud_data_dir is match('^/[^/]+')
      - nextcloud_hostname | length > 0
      - nextcloud_protocol in ['http', 'https']
      - nextcloud_trusted_proxy | length > 0
    fail_msg: "Invalid Nextcloud path, hostname, protocol, or trusted proxy configuration."

- name: Create Nextcloud application directory
  ansible.builtin.file:
    path: "{{ nextcloud_app_dir }}"
    state: directory
    owner: "{{ nextcloud_storage_owner }}"
    group: "{{ nextcloud_storage_group }}"
    mode: "0755"

- name: Create Nextcloud data directory
  ansible.builtin.file:
    path: "{{ nextcloud_data_dir }}/html"
    state: directory
    owner: "{{ nextcloud_container_uid }}"
    group: "{{ nextcloud_container_gid }}"
    mode: "0755"

- name: Deploy Nextcloud Docker Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ nextcloud_app_dir }}/compose.yml"
    owner: "{{ nextcloud_storage_owner }}"
    group: "{{ nextcloud_storage_group }}"
    mode: "0644"

- name: Deploy Nextcloud stack
  community.docker.docker_compose_v2:
    project_src: "{{ nextcloud_app_dir }}"
    state: present
  when: not ansible_check_mode

- name: Wait for Nextcloud container to be running
  community.docker.docker_container_info:
    name: "{{ nextcloud_container_name }}"
  register: nextcloud_container_info
  until:
    - nextcloud_container_info.exists
    - nextcloud_container_info.container.State.Running
  retries: 30
  delay: 5
  when: not ansible_check_mode

- name: Wait for Nextcloud initialization to complete
  ansible.builtin.command:
    cmd: >
      docker exec {{ nextcloud_container_name }}
      test -f /var/www/html/lib/versioncheck.php
  register: nextcloud_initialization
  changed_when: false
  retries: 60
  delay: 5
  until: nextcloud_initialization.rc == 0
  when: not ansible_check_mode

- name: Check whether Nextcloud is installed
  ansible.builtin.command:
    cmd: >
      docker exec -u www-data {{ nextcloud_container_name }}
      php occ status --output=json
  register: nextcloud_status
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Set Nextcloud installation state
  ansible.builtin.set_fact:
    nextcloud_is_installed: >-
      {{
        (nextcloud_status.stdout | default('{}') | from_json).installed
        | default(false)
        | bool
      }}
  when: not ansible_check_mode

- name: Read current Nextcloud trusted proxy
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -u
      - www-data
      - "{{ nextcloud_container_name }}"
      - php
      - occ
      - config:system:get
      - trusted_proxies
      - "0"
  register: nextcloud_current_trusted_proxy
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - nextcloud_is_installed | default(false) | bool

- name: Configure Nextcloud trusted proxy
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -u
      - www-data
      - "{{ nextcloud_container_name }}"
      - php
      - occ
      - config:system:set
      - trusted_proxies
      - "0"
      - "--value={{ nextcloud_trusted_proxy }}"
  when:
    - not ansible_check_mode
    - nextcloud_is_installed | default(false) | bool
    - nextcloud_current_trusted_proxy.stdout | trim != nextcloud_trusted_proxy

- name: Read current Nextcloud scalar proxy configuration
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -u
      - www-data
      - "{{ nextcloud_container_name }}"
      - php
      - occ
      - config:system:get
      - "{{ item.key }}"
  loop:
    - key: overwriteprotocol
      value: "{{ nextcloud_protocol }}"
    - key: overwritehost
      value: "{{ nextcloud_hostname }}"
  register: nextcloud_current_proxy_config
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - nextcloud_is_installed | default(false) | bool

- name: Configure Nextcloud scalar proxy configuration
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -u
      - www-data
      - "{{ nextcloud_container_name }}"
      - php
      - occ
      - config:system:set
      - "{{ item.item.key }}"
      - "--value={{ item.item.value }}"
  loop: "{{ nextcloud_current_proxy_config.results }}"
  when:
    - not ansible_check_mode
    - nextcloud_is_installed | default(false) | bool
    - item.stdout | trim != item.item.value | string