---
- name: Validate supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "Debian"
    fail_msg: >-
      The common_packages role currently supports Debian-based systems only.
      Detected OS family: {{ ansible_facts.os_family }}

- name: Install common system packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
