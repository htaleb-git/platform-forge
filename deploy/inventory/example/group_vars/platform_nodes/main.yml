---
# Platform-wide identity and storage contract.
platform_admin_user: platform-admin
platform_timezone: Etc/UTC
platform_domain: example.com
platform_ssh_port: 22
platform_hostname: "{{ inventory_hostname }}"
platform_fqdn: "{{ platform_hostname }}.{{ platform_domain }}"

platform_root: /srv/platform-forge
platform_apps_root: "{{ platform_root }}/apps"
platform_data_root: "{{ platform_root }}/data"
platform_backup_root: "{{ platform_root }}/backups"

# Public keys are deployment-specific local controller paths.
platform_admin_authorized_keys: []
platform_ssh_password_authentication: false

# Applications are opt-in.
gitlab_enabled: false
nextcloud_enabled: false
n8n_enabled: false
wordpress_enabled: false

# Node exporters and central monitoring services are separate capabilities.
node_exporter_enabled: false
cadvisor_enabled: false
prometheus_enabled: false
grafana_enabled: false

# Application artifacts are independent from Restic repository snapshots.
backup_gitlab_enabled: false
backup_nextcloud_enabled: false
backup_n8n_enabled: false
backup_wordpress_enabled: false

# Generic Restic backend contract. Replace the example repository before use.
restic_enabled: false
restic_repository: "rest:https://backup.example.com/platform-forge"
restic_environment: {}
restic_options: []
restic_backup_paths:
  - "{{ platform_backup_root }}"
restic_tags:
  - platform-forge
  - "{{ inventory_hostname }}"
restic_retention:
  keep_daily: 7
  keep_weekly: 4
  keep_monthly: 12
restic_prune_enabled: false

# Shared container networks used by enabled components.
docker_networks:
  - name: proxy
  - name: monitoring

# Reverse proxy TLS. The example secrets file documents internal TLS material.
traefik_tls_mode: internal
traefik_tls_cert_name: platform.crt
traefik_tls_private_key_name: platform.key

# Application configuration belongs here; secrets belong in vault.yml.example.
n8n_hostname: "n8n.{{ platform_domain }}"
n8n_protocol: https
n8n_postgres_db: n8n
n8n_postgres_user: n8n
n8n_network_proxy: proxy
n8n_network_backend: n8n_backend

nextcloud_hostname: "nextcloud.{{ platform_domain }}"
nextcloud_network_proxy: proxy

wordpress_hostname: "wordpress.{{ platform_domain }}"
wordpress_db_name: wordpress
wordpress_db_user: wordpress
wordpress_network_proxy: proxy
wordpress_network_backend: wordpress_backend

gitlab_hostname: "gitlab.{{ platform_domain }}"
gitlab_external_url: "https://{{ gitlab_hostname }}"
gitlab_ssh_port: 2222
gitlab_network_proxy: proxy
