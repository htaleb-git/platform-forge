---
# Required platform identity and access inputs.
platform_admin_user: platform-admin
platform_domain: example.com
platform_admin_authorized_keys: []

# Optional platform policy.
platform_timezone: Etc/UTC
platform_root: /srv/platform-forge
# platform_hostname: platform01
# platform_ssh_port: 22

# Optional additive system packages and swap capability.
system_update_additional_packages: []
system_swap_enabled: false

# Applications are opt-in.
n8n_enabled: false
nextcloud_enabled: false
wordpress_enabled: false
gitlab_enabled: false

# Optional hostname overrides derive from platform_domain when omitted.
# n8n_hostname: automation.example.com
# nextcloud_hostname: cloud.example.com
# wordpress_hostname: www.example.com
# gitlab_hostname: code.example.com
gitlab_ssh_port: 2222

# Reverse proxy TLS. Internal TLS uses Vault-provided material by default. Set
# traefik_internal_tls_source: generated for an opt-in self-signed certificate.
# ACME requires a real contact email.
traefik_tls_mode: internal
traefik_internal_tls_source: provided
traefik_acme_email: ""

# Monitoring capabilities remain independently opt-in. Grafana requires
# Prometheus. Prometheus only scrapes enabled exporters.
node_exporter_enabled: false
cadvisor_enabled: false
prometheus_enabled: false
grafana_enabled: false
prometheus_scrape_interval: 30s
prometheus_retention_time: 30d

# Application artifact policy. Enable only for an enabled application.
backup_n8n_enabled: false
backup_n8n_schedule: "*-*-* 03:00:00"
backup_n8n_generations_to_keep: 2

backup_nextcloud_enabled: false
backup_nextcloud_schedule: "*-*-* 03:10:00"
backup_nextcloud_generations_to_keep: 2

backup_wordpress_enabled: false
backup_wordpress_schedule: "*-*-* 03:20:00"
backup_wordpress_generations_to_keep: 2

backup_gitlab_enabled: false
backup_gitlab_schedule: "*-*-* 03:30:00"
backup_gitlab_generations_to_keep: 2

# Restic snapshots published application artifacts. Set a real repository and
# Vault password before enabling it; the repository must already exist.
restic_enabled: false
restic_repository: ""
restic_retention:
  keep_daily: 7
  keep_weekly: 4
  keep_monthly: 12
restic_backup_schedule: "*-*-* 04:00:00"
restic_check_schedule: "Sun *-*-* 03:00:00"
restic_maintenance_schedule: "Sun *-*-* 04:00:00"
